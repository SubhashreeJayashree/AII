<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Messages</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light">
  <div class="container-fluid px-3">
    <a class="navbar-brand" href="/">AI Social Clone</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="/feed.html">Feed</a></li>
        <li class="nav-item"><a class="nav-link" href="/chat.html">AI Assistant</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container p-3">
  <h2 class="h5 mb-3">Messages / Calls / Voice Notes</h2>
  <div class="row">
    <div class="col-12 col-md-4 mb-3">
      <div id="threads" class="list-group"></div>
      <div class="mt-3">
        <input id="roomInput" class="form-control mb-2" placeholder="Room ID (e.g., room1)" />
        <button id="joinBtn" class="btn btn-sm btn-outline-primary w-100 mb-2">Join Room</button>
        <button id="callBtn" class="btn btn-sm btn-success w-100 mb-2">Start Call</button>
        <button id="hangupBtn" class="btn btn-sm btn-danger w-100 mb-2">Hang Up</button>
        <button id="recordBtn" class="btn btn-sm btn-secondary w-100">Record Voice Note</button>
        <div class="mt-2">
          <small>Voice notes are uploaded and optionally transcribed (requires `OPENAI_API_KEY`).</small>
        </div>
      </div>
    </div>

    <div class="col-12 col-md-8">
      <div class="card p-2">
        <div id="conversation" style="height:50vh; min-height:220px; overflow:auto;" class="mb-2"></div>
        <div class="d-flex gap-2">
          <input id="messageInput" class="form-control" placeholder="Type a message...">
          <button id="sendBtn" class="btn btn-primary">Send</button>
        </div>
      </div>

      <div id="callArea" class="mt-3">
        <div id="localContainer"></div>
        <div id="remoteContainer"></div>
      </div>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/webrtc.js"></script>
<script src="/js/recorder.js"></script>
<script>
const socket = window.RTC?.socket || io();
let currentRoom = null;
const convEl = document.getElementById("conversation");
const input = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const joinBtn = document.getElementById("joinBtn");
const roomInput = document.getElementById("roomInput");
const callBtn = document.getElementById("callBtn");
const hangupBtn = document.getElementById("hangupBtn");
const recordBtn = document.getElementById("recordBtn");

function appendMessage(from, text) {
  const wrap = document.createElement('div');
  wrap.className = 'mb-2';
  wrap.innerHTML = `<strong>${from}:</strong> ${text}`;
  convEl.appendChild(wrap);
  convEl.scrollTop = convEl.scrollHeight;
}

sendBtn.onclick = () => {
  const text = input.value.trim();
  if (!text) return;
  const payload = { room: currentRoom, message: text, from: "You" };
  socket.emit("chat-message", payload);
  appendMessage("You", text);
  input.value = "";
};

socket.on("chat-message", (p) => appendMessage(p.from || "Peer", p.message));

joinBtn.onclick = () => {
  const r = roomInput.value.trim();
  if (!r) { alert("Enter a room id"); return; }
  currentRoom = r;
  window.RTC?.joinRoom(r);
  appendMessage("System", `Joined room ${r}`);
};

socket.on("peer-joined", (d) => {
  appendMessage("System", `Peer joined: ${d.id}`);
  const btn = document.createElement("button");
  btn.className = "list-group-item list-group-item-action";
  btn.textContent = `Call peer ${d.id}`;
  btn.onclick = () => window.RTC?.startCallWith(d.id, { audio: true, video: true });
  document.getElementById("threads").appendChild(btn);
});

callBtn.onclick = async () => {
  const btn = document.querySelector("#threads button");
  if (!btn) { alert("No peer to call. Wait for peer to join."); return; }
  const id = btn.textContent.replace("Call peer ", "").trim();
  try {
    await window.RTC.getLocalMedia({ audio: true, video: true });
    const localVideo = document.createElement("video");
    localVideo.id = "localVideo";
    localVideo.muted = true; localVideo.autoplay = true; localVideo.playsInline = true;
    localVideo.srcObject = window.RTC.localStream || null;
    document.getElementById("localContainer").appendChild(localVideo);
    await window.RTC.startCallWith(id, { audio: true, video: true });
  } catch (err) { console.error(err); alert("Could not start media: " + err.message); }
};

hangupBtn.onclick = () => { window.RTC?.hangup(); appendMessage("System", "Call ended"); };

let recorder = null;
recordBtn.onclick = async () => {
  if (!recorder) {
    recorder = await recordVoiceNote(async (resp, blob) => {
      appendMessage("System", `Voice note uploaded: ${resp.file || "unknown"}`);
      appendMessage("You", `[Voice note sent: ${resp.file || "file"}]`);
      if (resp.transcription) appendMessage("AI (transcribed)", resp.transcription);
      if (resp.ai_reply) appendMessage("AI (reply)", resp.ai_reply);
      recorder = null; recordBtn.textContent = "Record Voice Note";
    });
    recordBtn.textContent = "Stop Recording";
  } else {
    await recorder.stop();
    recorder = null;
    recordBtn.textContent = "Record Voice Note";
  }
};
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
