<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>AI Human → Robot Translation Engine</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>🤖 Human → Robot Translation Engine</h1>

    <div class="chat-box" id="chatBox"></div>

    <div class="input-area">
        <input type="text" id="taskInput" placeholder="Enter a task... (Example: Clean the table neatly)">
        <select id="modeSelect" title="Choose a robot mode">
            <option value="default">Mode: Robot</option>
            <option value="teacher">Teacher</option>
            <option value="storyteller">Storyteller</option>
            <option value="emotional">Emotional (blunt)</option>
            <option value="motivational">Motivational Speaker</option>
        </select>
        <select id="languageSelect" title="Story/Language">
            <option value="any">Any language</option>
            <option value="en">English</option>
            <option value="ta">Tamil</option>
            <option value="es">Spanish</option>
            <option value="fr">French</option>
        </select>
        <select id="subjectSelect" title="Subject for teacher mode">
            <option value="">Subject (optional)</option>
            <option value="tamil">Tamil</option>
            <option value="english">English</option>
            <option value="mathematics">Mathematics</option>
            <option value="physics">Physics</option>
            <option value="chemistry">Chemistry</option>
            <option value="botany">Botany</option>
            <option value="zoology">Zoology</option>
            <option value="commerce">Commerce</option>
            <option value="economics">Economics</option>
            <option value="computer">Computer Application</option>
            <option value="accountancy">Accountancy</option>
            <option value="c">C</option>
            <option value="cpp">C++</option>
            <option value="java">Java</option>
            <option value="python">Python</option>
            <option value="ai_ml">AI / Machine Learning</option>
            <option value="dl">Deep Learning</option>
            <option value="generative_ai">Generative AI</option>
        </select>
        <select id="emotionSelect" title="Emotion for Emotional mode">
            <option value="default">Emotion: default</option>
            <option value="happy">Happy</option>
            <option value="sad">Sad</option>
            <option value="angry">Angry</option>
        </select>
        <input id="storyCount" type="number" min="1" max="5" value="2" title="Number of stories to generate" style="width:60px;margin-left:6px;">
        <select id="storyLength" title="Story length" style="margin-left:6px;">
            <option value="short">Short</option>
            <option value="medium" selected>Medium</option>
            <option value="long">Long</option>
        </select>
        <label style="display:flex;align-items:center;gap:6px;margin-left:6px;">
            <input type="checkbox" id="useAI"> Use AI
        </label>
        <label style="display:flex;align-items:center;gap:6px;margin-left:6px;">
            <input type="checkbox" id="quickToggle"> Quick
        </label>
        <button onclick="sendTask()">Send</button>
        <button id="voiceButton" onclick="speakText()">🔊 Voice</button>
        <button id="recordButton">🎤 Record</button>
    </div>

    <div class="robot-area">
        <img id="robotImage" src="assests/images/robot_idle.png" class="robot">
        <p id="robotAction">Robot is idle...</p>
        <p id="robotStatus">Status: idle</p>
    </div>
<div id="output" class="output-box"></div>
</div>

<script src="script.js"></script>
</body>
</html>
